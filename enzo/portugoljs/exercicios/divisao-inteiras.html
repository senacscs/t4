<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Divisão Inteiras</title>
    <link rel="shortcut icon" href="images/divisão-inteiras.png" type="image/x-icon">
    <script>
      function calcular() {
        // Obter o valor digitado pelo usuário
        const valor = parseInt(document.getElementById("numero").value);

        // Calcular a metade inteira e o resto
        const metadeInteira = Math.floor(valor / 2);
        const resto = valor % 3;

        // Exibir os resultados
        document.getElementById("resultado").textContent =
          `A metade inteira do número é: ${metadeInteira}																																																																																	
O resto (mod) da divisão por 3 é: ${resto}`;
      }
    </script>
  </head>
  <body>
    <label for="numero">Digite um número:</label>
    <input type="number" id="numero" />
    <button onclick="calcular()">Calcular</button>
    <p id="resultado"></p>
  </body>
</html>

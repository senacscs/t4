<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Numero Digitado</title>
    <link rel="shortcut icon" href="images/numero-digitado-site-portugol.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css" />
    <script>
      function exibirNumero() {
        // Obter o valor digitado pelo usuário
        const numero = parseInt(document.getElementById("numero").value);

        // Exibir o resultado
        document.getElementById("resultado").textContent =
          `O número digitado foi: ${numero}`;
      }
    </script>
  </head>
  <body>
    <label for="numero">Digite um número inteiro:</label>
    <input type="number" id="numero" placeholder="Digite um numero..." />
    <button onclick="exibirNumero()">Exibir</button>
    <p id="resultado"></p>
  </body>
</html>
